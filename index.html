<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bottle Sort — puzzle de agua</title>
<meta name="description" content="Ordená las botellas por color. 4 modos y más de 2.900 niveles, funciona sin conexión.">
<meta name="author" content="RWT">
<meta name="theme-color" content="#2c1668">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bottle Sort">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c1668'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%23ffcc45'/%3E%3Crect x='21' y='36' width='22' height='20' rx='7' fill='%234fc3f7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-stars" aria-hidden="true"></div>
<div class="bg-sparkles" id="bgSparkles" aria-hidden="true"></div>

<header class="hud">
  <button class="hud-btn level-btn" id="btnLevels" aria-label="Mapa de niveles">
    <span class="level-icon" aria-hidden="true">✦</span>
    <span id="levelLabel">1</span>
  </button>
  <div class="hud-mid">
    <div class="stat"><span class="stat-k">Movimientos</span><span class="stat-v" id="movesLabel">0</span></div>
    <div class="stat" title="Tiempo del nivel (no hay límite)"><span class="stat-k">Tiempo</span><span class="stat-v" id="timeLabel">0:00</span></div>
  </div>
  <div class="hud-right">
    <div class="coins" title="Monedas"><span aria-hidden="true">🪙</span><span id="coinsLabel">1000</span></div>
    <button class="hud-btn gear-btn" id="btnSettings" aria-label="Ajustes" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42H10.1a.5.5 0 0 0-.5.42l-.36 2.54a7.03 7.03 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96a7.03 7.03 0 0 0 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.8a.5.5 0 0 0 .5-.42l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg></button>
  </div>
</header>

<main class="stage">
  <div class="board" id="board" role="group" aria-label="Botellas"></div>
  <div class="hint-line" id="hintLine">Toca una botella y luego otra para verter.</div>
</main>

<footer class="boosters">
  <button class="booster" id="btnUndo" data-booster="undo">
    <span class="booster-ico">↺</span><span class="booster-name">Deshacer</span><span class="booster-count" data-count="undo">3</span>
  </button>
  <button class="booster" id="btnShuffle" data-booster="shuffle">
    <span class="booster-ico">⇄</span><span class="booster-name">Mezclar</span><span class="booster-count" data-count="shuffle">3</span>
  </button>
  <button class="booster" id="btnExtra" data-booster="extra">
    <span class="booster-ico">🍶</span><span class="booster-name">Botella</span><span class="booster-count" data-count="extra">3</span>
  </button>
  <button class="booster" id="btnReveal" data-booster="reveal">
    <span class="booster-ico">👁</span><span class="booster-name">Revelar</span><span class="booster-count" data-count="reveal">3</span>
  </button>
  <button class="booster" id="btnRestart" data-booster="restart">
    <span class="booster-ico">⟳</span><span class="booster-name">Reiniciar</span>
  </button>
</footer>

<!-- Victoria -->
<div class="overlay" id="winOverlay" hidden>
  <div class="card win-card">
    <div class="win-title">¡Nivel completado!</div>
    <div class="stars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="win-sub" id="winSub">12 movimientos</div>
    <div class="win-reward"><span aria-hidden="true">🪙</span><span id="winCoins">+20</span></div>
    <button class="primary" id="btnNext">Siguiente nivel</button>
  </div>
</div>


<!-- Ajustes: volumen y música por separado -->
<div class="sheet" id="settingsSheet" hidden>
  <div class="sheet-card" role="dialog" aria-label="Ajustes">
    <div class="sheet-title">Ajustes</div>
    <button class="toggle" id="btnSfx" aria-pressed="true">
      <span class="toggle-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12ZM14 3.23v2.06a6.99 6.99 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23Z"/></svg><span class="slash" aria-hidden="true"></span></span>
      <span class="toggle-txt"><b>Sonido</b><small id="sfxState">Activado</small></span>
    </button>
    <button class="toggle" id="btnMusic" aria-pressed="true">
      <span class="toggle-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/></svg><span class="slash" aria-hidden="true"></span></span>
      <span class="toggle-txt"><b>Música</b><small id="musicState">Activada</small></span>
    </button>
    <div class="sheet-sep">Velocidad</div>
    <div class="speed-row" role="group" aria-label="Velocidad del juego">
      <button class="speed-chip" data-speed="1" aria-pressed="true">×1</button>
      <button class="speed-chip" data-speed="2" aria-pressed="false">×2</button>
      <button class="speed-chip" data-speed="3" aria-pressed="false">×3</button>
    </div>
    <button class="toggle" id="btnAnim" aria-pressed="true">
      <span class="toggle-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg><span class="slash" aria-hidden="true"></span></span>
      <span class="toggle-txt"><b>Animaciones</b><small id="animState">Activadas</small></span>
    </button>
    <button class="install-btn" id="btnInstall" hidden>
      <span class="install-ico" aria-hidden="true">⬇</span>
      <span id="installLabel">Instalar app</span>
    </button>
    <div class="install-hint" id="installHint" hidden></div>

    <button class="ghost" id="btnCloseSettings">Cerrar</button>
    <div class="credit">Desarrollado por <b>RWT</b></div>
  </div>
</div>

<!-- Sin jugadas -->
<div class="overlay" id="stuckOverlay" hidden>
  <div class="card stuck-card">
    <div class="stuck-title">¡Sin jugadas!</div>
    <div class="stuck-sub" id="stuckSub">No queda ningún vertido posible.</div>
    <button class="primary" id="btnStuckShuffle">Mezclar</button>
    <button class="ghost" id="btnStuckExtra">Añadir botella</button>
    <button class="ghost" id="btnStuckUndo">Deshacer</button>
    <button class="ghost" id="btnStuckRestart">Reiniciar nivel</button>
  </div>
</div>

<!-- Mapa de niveles -->
<div class="overlay" id="levelsOverlay" hidden>
  <div class="card levels-card">
    <div class="mode-tabs" id="modeTabs"></div>
    <div class="levels-head">
      <h2>Niveles</h2>
      <button class="ghost" id="btnCloseLevels">Cerrar</button>
    </div>
    <div class="levels-grid" id="levelsGrid"></div>
  </div>
</div>

<script src="engine.js"></script>
<script src="data/levels.js"></script>
<script src="app.js"></script>
</body>
</html>
